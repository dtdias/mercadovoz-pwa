name: Atualizar Preços Semanais
permissions:
  contents: write
concurrency:
  group: atualizar-precos-${{ github.ref }}
  cancel-in-progress: false
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Testar atualizador
        run: python scripts/test_atualizar_precos.py

      - name: Executar script de atualização
        run: python scripts/atualizar_precos.py

      - name: Validar catálogo gerado
        run: |
          python scripts/atualizar_precos.py --check
          python -m json.tool precos.json > /dev/null

      - name: Commit e Push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precos.json
          git diff --cached --check
          if git diff --cached --quiet -- precos.json; then
            echo "Nenhuma alteração válida no catálogo."
            exit 0
          fi
          git status --short
          git commit -m "bot: atualização semanal de preços"
          git push origin "HEAD:${GITHUB_REF_NAME}"
